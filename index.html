<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Belajar ERP YonSuite</title>
<meta name="description" content="Catatan belajar pribadi YonSuite ERP — Digital Modeling, AACT/COA, AP, AR, FA, GL, Inventory, Purchasing, Sales, dan Issue Log troubleshooting.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23c8102e%22/><text x=%2212%22 y=%2216.5%22 font-size=%2211%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>YS</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script>
(function () {
  try {
    var raw = localStorage.getItem("ys-theme-pref");
    var pref = raw ? JSON.parse(raw) : { palette: "red", mode: "system" };
    var mode = pref.mode === "system"
      ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : pref.mode;
    document.documentElement.setAttribute("data-palette", pref.palette || "red");
    document.documentElement.setAttribute("data-theme", mode);
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Buka menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <span class="brand-mobile">Catatan ERP</span>
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari keyword di semua modul & issue log..." autocomplete="off">
      <span class="search-shortcut">/</span>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="theme-picker">
      <button class="theme-btn" id="themeToggle" aria-label="Pilih tema warna">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2"></circle><circle cx="17.5" cy="10.5" r="1.2"></circle><circle cx="8.5" cy="7.5" r="1.2"></circle><circle cx="6.5" cy="12.5" r="1.2"></circle><path d="M12 22a10 10 0 1 1 0-20c1 0 2 .8 2 2 0 .6-.3 1-.6 1.4-.3.4-.6.8-.6 1.4 0 1 1 1.8 2 1.8h2.4c1.5 0 2.8 1.3 2.8 2.8C20 18 16.5 22 12 22z"></path></svg>
        <span class="theme-btn-label">Tema</span>
      </button>
      <div class="theme-panel" id="themePanel"></div>
    </div>
  </header>

  <main class="main" id="app"></main>
</div>

<script src="assets/js/vendor/marked.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
